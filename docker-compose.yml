version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: "Study Group Matcher/Dockerfile"
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    volumes:
      - ./Study Group Matcher:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
